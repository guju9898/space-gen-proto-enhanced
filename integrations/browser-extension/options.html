<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renderspace settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><img src="icon-48.png" alt=""><h1>Renderspace settings</h1></header>
    <p>Right-click any photo of a yard, house or room and choose <strong>Render this photo with Renderspace</strong>. The concept appears in about 30 seconds.</p>
    <label for="key">Your API key</label>
    <input id="key" type="password" autocomplete="off" placeholder="rs_live_…">
    <p class="muted">Create one at <a href="https://www.renderspace.ai/developers" target="_blank" rel="noopener">renderspace.ai/developers</a> (Professional or Business plan). It is stored only in this browser and sent only to renderspace.ai.</p>
    <button id="save">Save</button>
    <p id="status" class="muted"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
